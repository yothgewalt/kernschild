name: bookingsystem

x-common-env: &common-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -lqt | grep -qw payment"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  auth:
    build: ./apps/auth-service
    restart: unless-stopped
    environment:
      GRPC_ADDR: ":50051"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/auth?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
    ports: ["50051:50051"]
    depends_on:
      postgres: { condition: service_healthy }

  event:
    build: ./apps/event-service
    restart: unless-stopped
    environment:
      GRPC_ADDR: ":50052"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/event?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      HOLD_TTL: ${HOLD_TTL:-15s}
      SWEEP_INTERVAL: 1s
    ports: ["50052:50052"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  payment:
    build: ./apps/payment-service
    restart: unless-stopped
    environment:
      <<: *common-env
      GRPC_ADDR: "[::]:50053"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/payment
      PAYMENT_MIN_DELAY: ${PAYMENT_MIN_DELAY:-2}
      PAYMENT_MAX_DELAY: ${PAYMENT_MAX_DELAY:-6}
      PAYMENT_SUCCESS_RATE: ${PAYMENT_SUCCESS_RATE:-0.8}
      PAYMENT_CONCURRENCY: ${PAYMENT_CONCURRENCY:-200}
    ports: ["50053:50053"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  booking:
    build: ./apps/booking-service
    restart: unless-stopped
    environment:
      <<: *common-env
      HTTP_PORT: "3000"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/booking
      AUTH_ADDR: auth:50051
      EVENT_ADDR: event:50052
      PAYMENT_ADDR: payment:50053
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth: { condition: service_started }
      event: { condition: service_started }
      payment: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
